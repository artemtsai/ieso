# mTLS termination for the control plane (DESIGN.md §11 "Ingress": cert-to-endpoint check).
# Only clients with a certificate signed by our CA get through; the verified CN/O are forwarded as headers.
events {}
http {
  map $ssl_client_s_dn $client_cn {
    default "";
    ~CN=(?<cn>[^,/]+) $cn;
  }
  map $ssl_client_s_dn $client_org {
    default "";
    ~O=(?<org>[^,/]+) $org;
  }
  server {
    listen 8443 ssl;
    ssl_certificate        /certs/server.pem;
    ssl_certificate_key    /certs/server.key;
    ssl_client_certificate /certs/ca.pem;
    ssl_verify_client      on;
    ssl_protocols          TLSv1.3;          # TLS 1.3 only; TLS 1.2 and older are refused
    client_max_body_size   32m;     # incident bundles
    location /v1/admin/ {
      return 403;                      # internal admin API: backend network only, never through the ingress
    }
    location / {
      proxy_set_header X-Client-CN  $client_cn;    # never taken from the client: overwritten here
      proxy_set_header X-Client-Org $client_org;
      proxy_pass http://control-plane:8000;
    }
  }
}
