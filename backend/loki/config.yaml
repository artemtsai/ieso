# Loki single binary with native OTLP ingestion (structured metadata on schema v13).
auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore: {store: inmemory}
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}
limits_config:
  allow_structured_metadata: true
  reject_old_samples: false        # spooled events replayed after an outage
  unordered_writes: true
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [service.instance.id]
analytics:
  reporting_enabled: false
