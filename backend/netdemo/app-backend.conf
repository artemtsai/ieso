# DemoApp's own backend (fictional). Its certificate chains to "DemoApp Backend CA", which the app pins.
events {}
http {
  server {
    listen 9443 ssl;
    ssl_certificate     /certs/demo/backend.pem;
    ssl_certificate_key /certs/demo/backend.key;
    location / {
      default_type application/json;
      return 200 '{"status":"ok","service":"demoapp-backend"}';
    }
  }
}
